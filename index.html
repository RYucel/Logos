  <body class="bg-[#f7f9ff] text-[#161c22] font-sans antialiased selection:bg-[#005ba1] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('✓ LOGOS PWA ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('ServiceWorker registration skipped or failed:', error);
            });
        });
      }
    </script>
  </body>
