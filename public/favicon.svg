
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ba1" />
      <stop offset="50%" stop-color="#003e73" />
      <stop offset="100%" stop-color="#002142" />
    </linearGradient>

    <!-- Accent Gold Gradient for Lambda & Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F7FA" />
      <stop offset="100%" stop-color="#D0E4FF" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7.68" stdDeviation="10.24" flood-color="#001428" flood-opacity="0.5"/>
    </filter>

    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5.12" stdDeviation="7.68" flood-color="#001830" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)" />

  <!-- Geometric Greek Pattern Accent (Subtle Inner Border) -->
  <rect x="53.8624" y="53.8624" 
        width="404.2752" height="404.2752" 
        rx="90.11200000000001" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.15)" 
        stroke-width="4.096" 
        stroke-dasharray="15.36 7.68" />

  <!-- Center Circle Shield / Laurel Ring -->
  <circle cx="256" cy="256" r="180.63359999999997" 
          fill="rgba(0, 45, 90, 0.4)" 
          stroke="rgba(252, 211, 77, 0.35)" 
          stroke-width="5.12" />

  <!-- Greek Lambda 'Λ' Typography & Classical Elegance -->
  <g filter="url(#letterShadow)">
    <text x="256" y="350.6176" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cinzel', serif" 
          font-size="266.64959999999996" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#goldGrad)" 
          letter-spacing="-1">Λ</text>
  </g>

  <!-- Subtle Gold Crown / Pillar Star at the apex of Lambda -->
  <circle cx="256" cy="135.5776" r="19.3536" fill="url(#goldAccent)" filter="url(#glow)"/>

  <!-- Subtitle / Brand Mark 'LOGOS' at the bottom of the shield -->
  <text x="256" y="419.43039999999996" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="38.7072" 
        font-weight="800" 
        text-anchor="middle" 
        letter-spacing="10.752" 
        fill="#93C5FD">LOGOS</text>
</svg>
